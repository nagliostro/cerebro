<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1013" />
    <title>Cerebro</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(120% 70% at 50% -10%, oklch(0.25 0.03 255), transparent 70%),
          oklch(0.13 0.006 265);
        font:
          500 12px/1.6 ui-monospace,
          monospace;
        color: oklch(1 0 0 / 55%);
        text-align: center;
      }
      main {
        width: min(100% - 32px, 26rem);
        display: grid;
        justify-items: center;
        gap: 12px;
      }
      h1 {
        margin: 0;
        font: inherit;
        color: #fff;
      }
      p {
        margin: 0;
      }
      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #000;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- The shell kept by the service worker: shown when the Cerebro's computer does not answer. -->
    <main>
      <h1 id="title">O computador do Cerebro não respondeu</h1>
      <p id="why">Ele precisa estar ligado, com o Cerebro aberto e o acesso remoto ligado.</p>
      <button id="again" type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
    <script>
      if (!navigator.language.toLowerCase().startsWith('pt')) {
        document.documentElement.lang = 'en';
        document.getElementById('title').textContent = "The Cerebro's computer did not answer";
        document.getElementById('why').textContent =
          'It needs to be on, with the Cerebro open and remote access turned on.';
        document.getElementById('again').textContent = 'Try again';
      }
    </script>
  </body>
</html>
